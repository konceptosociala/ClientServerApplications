<form id="login-form" class="container flex-column d-flex justify-content-center align-items-center" style="min-height: 100vh;">
   <h2 class="mb-2 text-center">Sign in</h2>
   <div id="login-error"></div>
   <div class="form-group col-12 col-lg-4 col-md-8 col-sm-12 mb-2">
      <label for="input-login">Login</label>
      <input type="text" class="form-control" id="input-login" aria-describedby="loginHelp"
         placeholder="Enter login">
   </div>
   <div class="form-group col-12 col-lg-4 col-md-8 col-sm-12 mb-3">
      <label for="input-password">Password</label>
      <input type="password" class="form-control" id="input-password" placeholder="Password">
   </div>
   <button type="submit" class="btn btn-primary">Sign in</button>
</form>
