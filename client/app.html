<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="productModalLabel">Додати товар</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="product-name" class="form-label">Назва</label>
          <input type="text" class="form-control" id="product-name">
        </div>
        <div class="mb-3">
          <label for="product-description" class="form-label">Опис</label>
          <textarea class="form-control" id="product-description" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label for="product-manufacturer" class="form-label">Виробник</label>
          <input type="text" class="form-control" id="product-manufacturer">
        </div>
        <div class="mb-3">
          <label for="product-quantity" class="form-label">Кількість</label>
          <input type="number" class="form-control" id="product-quantity">
        </div>
        <div class="mb-3">
          <label for="product-price" class="form-label">Ціна за одиницю</label>
          <input type="number" class="form-control" step="0.01" id="product-price">
        </div>
        <div class="mb-3">
          <label for="product-group" class="form-label">Група</label>
          <select class="form-select" id="product-group"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
        <button type="button" class="btn btn-primary" id="save-product-btn">Зберегти</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="groupModal" tabindex="-1" aria-labelledby="groupModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="groupModalLabel">Додати групу товарів</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="group-name" class="form-label">Назва</label>
          <input type="text" class="form-control" id="group-name">
        </div>
        <div class="mb-3">
          <label for="group-description" class="form-label">Опис</label>
          <textarea class="form-control" id="group-description" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
        <button type="button" class="btn btn-primary" id="save-group-btn">Зберегти</button>
      </div>
    </div>
  </div>
</div>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
   <div class="container">
      <img height=50 src="assets/logo.png" alt="wrkplc">
      <div class="d-flex">
         <a id="logout" href="#" class="btn btn-danger">Log out</a>
      </div>
   </div>
</nav>

<section class="container-fluid">
  <div class="row" style="min-height: 100vh;">
    <!-- Sidebar: Product Groups -->
    <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar py-3 border-end">
      <h5 class="text-center">Групи товарів</h5>
      <ul id="group-list" class="nav flex-column px-2">
        <!-- Filled dynamically -->
      </ul>
      <div class="d-grid gap-2 mt-3 px-2">
        <button class="btn btn-outline-primary" id="add-group">Додати групу</button>
      </div>
    </nav>

    <!-- Main: Products -->
    <main class="col-md-9 col-lg-10 px-md-4 py-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Товари</h4>
        <div>
          <button class="btn btn-outline-secondary me-2" id="restock-product">Прийом товару</button>
          <button class="btn btn-outline-danger" id="sell-product">Списати товар</button>
          <button class="btn btn-primary" id="add-product">Додати товар</button>
        </div>
      </div>

      <!-- Search -->
      <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Пошук..." id="search-input">
        <button class="btn btn-outline-secondary" id="search-btn">Пошук</button>
      </div>

      <!-- Product Table -->
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-light">
            <tr>
              <th>Назва</th>
              <th>Опис</th>
              <th>Виробник</th>
              <th>Кількість</th>
              <th>Ціна</th>
              <th>Сума</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="product-table-body">
            <!-- Filled dynamically -->
          </tbody>
        </table>
      </div>

      <!-- Summary -->
      <div class="mt-4">
        <h5>Загальна вартість: <span id="total-value">0.00 грн</span></h5>
      </div>
    </main>
  </div>
</section>
